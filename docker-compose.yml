version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "change-me"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # SQLite database location inside the container (persisted on volume)
      SQLITE_PATH: /data/db.sqlite3
    volumes:
      - .:/app
      - sqlite_data:/data
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - redis

  # Optional Redis for Django Channels / caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  staticfiles_data:
  media_data:
  sqlite_data:
